name: Refresh RHMZ demo data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rhmz-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out the existing Pages site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Refresh timestamped source snapshots
        env:
          RHMZ_DATA_OUTPUT: rhmz-demo/data/weather.json
        run: node rhmz-demo/pipeline/refresh.mjs
      - name: Publish only the demo data file
        env:
          GH_TOKEN: ${{ github.token }}
        run: node rhmz-demo/pipeline/publish-data.mjs
